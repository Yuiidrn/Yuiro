[project]
name = "yuiro-engine"
version = "0.1.0"
description = "Yuiro Python engine: Agent / Voice / Memory orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=15",
    "msgpack>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "keyring>=25.0",
    "silero-vad>=5.0",
    "faster-whisper>=1.0",
    "funasr>=1.2",
    "modelscope>=1.20",
    "edge-tts>=6.1",
    "numpy>=1.26",
    "sqlite-vec>=0.1",
    "FlagEmbedding>=1.3",
    "openai>=1.40",
    "anthropic>=0.30",
    "httpx>=0.27",
    "mcp>=1.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
gpu = [
    "nvidia-cuda-runtime-cu12>=12",
    "nvidia-cublas-cu12>=12",
    "nvidia-cudnn-cu12>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuiro"]

[tool.ruff]
line-length = 100
target-version = "py311"
